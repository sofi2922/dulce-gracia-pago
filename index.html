<!DOCTYPE html>
<html lang="es">
<head>

  <title>Dulce Gracia | Datos de transferencia</title>

  <style>
    * {

    }

    body {
      margin: 0;
      min-height: 100vh;

      background: #fff7fa;

      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 8px 30px rgba(120, 80, 100, 0.12);
      text-align: center;
    }

    .logo {
      font-size: 32px;
      font-weight: 700;
      color: #b56b88;
      margin-bottom: 5px;
    }

    .subtitle {
      margin-top: 0;
      margin-bottom: 25px;
      color: #8c737c;
      font-size: 15px;
    }

    .datos {
      text-align: left;
      background: #fff1f5;
      border-radius: 16px;
      padding: 18px;
    }

    .dato {
      margin-bottom: 15px;
    }

    .dato:last-child {
      margin-bottom: 0;
    }

    .etiqueta {
      display: block;
      font-size: 12px;
      color: #9b7c87;
      margin-bottom: 3px;
    }

    .valor {
      font-size: 16px;
      font-weight: 600;
      color: #4a3a40;
      word-break: break-word;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: #c97999;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    #mensaje {
      margin-top: 12px;
      min-height: 20px;
      color: #6b9b72;
      font-size: 14px;
      font-weight: 600;
    }

    .gracias {
      margin-top: 22px;
      font-size: 13px;
      color: #9b7c87;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">Dulce Gracia</div>

    <p class="subtitle">
      Datos para realizar tu transferencia
    </p>

    <div class="datos">

      <div class="dato">
        <span class="etiqueta">Nombre</span>
        <span class="valor">Sofía Gómez</span>
      </div>

      <div class="dato">

  <script>
    function copiarDatos() {
      const datos =
`Sofía Gómez
RUT: 21.028.944-5
Mercado Pago
Cuenta Vista
Número de cuenta: 1073527816
Correo: sofiagomezvera6@gmail.com`;

      navigator.clipboard.writeText(datos).then(function() {
        document.getElementById("mensaje").textContent =

        document.getElementById("mensaje").textContent =
